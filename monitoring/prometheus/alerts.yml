groups:
  - name: school-platform
    rules:
      - alert: AppDown
        expr: up{job="app"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Приложение недоступно для Prometheus уже минуту"

      - alert: HighApiLatencyP95
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 0.2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p95 ответа API превышает 200 мс дольше 5 минут (гейт Э0)"

      - alert: AppMemoryHigh
        expr: process_resident_memory_bytes{job="app"} > 1073741824
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "RAM процесса app превысила 1 ГБ дольше 5 минут (гейт Э0)"

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "postgres-exporter не может достучаться до PostgreSQL"

      - alert: PlatformTrafficHigh
        expr: sum(lesson_traffic_mbit) > 600
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "Суммарный расчётный трафик уроков превышает 600 Мбит/с (80% медиа-бюджета, §10.8 ТЗ) дольше 2 минут"

      # Э10.5, §10.4 ТЗ: «egress без публикующих — рекордер жжёт CPU и
      # хранилище впустую». Запись идёт (lesson_recording_no_publishers
      # существует для урока), а участников в уроке ноль. 10 минут выдержки —
      # чтобы не дёргать на кратких переподключениях всего класса и на
      # хвосте урока, где запись ещё финализируется.
      - alert: RecordingWithoutPublishers
        expr: max by (lesson_id) (lesson_recording_no_publishers) == 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Запись урока {{ $labels.lesson_id }} идёт больше 10 минут без единого участника на связи — egress жжёт CPU второй машины впустую, остановите запись"

      # Когда вторая машина реально поднята, у egress есть собственные
      # метрики на :9090 (scrape job `egress` в prometheus.yml, закомментирован
      # до появления приватного IP). Точное имя метрики зависит от версии
      # образа livekit/egress — свериться через Context7 при подключении
      # второй машины и добавить сюда алерт на «CPU egress высок, а
      # lesson_recording_active == 0» (рассинхрон egress/БД).

  # Медиа-сервер. Метрики LiveKit (prometheus.port 6789, livekit 1.13.x):
  # оценка связи участников (0 = poor, 1 = good, 2 = excellent), PLI, задержка
  # пересылки. До этого о качестве живых уроков узнавали только из жалоб.
  - name: livekit
    rules:
      - alert: LiveKitDown
        expr: up{job="livekit"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LiveKit не отдаёт метрики уже минуту — уроки без видео и звука"

      - alert: LiveKitPoorQualityShare
        expr: |
          sum(rate(livekit_quality_rating_bucket{le="0"}[10m]))
            / sum(rate(livekit_quality_rating_count[10m])) > 0.2
          and sum(livekit_participant_total) >= 2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Больше 20 % оценок связи участников — poor дольше 10 минут"

      - alert: LiveKitPliStorm
        expr: |
          sum(rate(livekit_pli_total[5m])) / clamp_min(sum(livekit_participant_total), 1) > 1
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Больше 1 запроса ключевого кадра в секунду на участника 10 минут — у кого-то сыпется видео"

      - alert: LiveKitForwardLatencyHigh
        expr: |
          histogram_quantile(0.9, sum(rate(livekit_forward_latency_ns_bucket[5m])) by (le)) > 50e6
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p90 задержки пересылки в SFU выше 50 мс 5 минут — SFU упирается в CPU"
