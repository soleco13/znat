name: Push mirror

# Независимость от GitHub (§10.10 ТЗ): при каждом push зеркалируем репозиторий
# на вторую площадку. Требует секретов репозитория:
#   MIRROR_URL      — например git@codeberg.org:org/school-platform.git
#   MIRROR_SSH_KEY  — приватный ключ с правом push в зеркало (secrets.MIRROR_SSH_KEY)
# Пока секреты не заданы, джоба безопасно пропускается.

on:
  push:
    branches: ["**"]
    tags: ["**"]

jobs:
  mirror:
    runs-on: ubuntu-latest
    if: ${{ vars.MIRROR_URL != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push mirror
        env:
          MIRROR_URL: ${{ vars.MIRROR_URL }}
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.MIRROR_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$(echo "$MIRROR_URL" | sed -E 's#.*@([^:/]+).*#\1#')" >> ~/.ssh/known_hosts
          git remote add mirror "$MIRROR_URL"
          git push --mirror mirror
