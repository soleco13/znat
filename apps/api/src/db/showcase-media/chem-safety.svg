    <circle cx="800" cy="230" r="62" fill="#fde68a"/>
    <path d="M745 205c10-50 100-60 112 0" fill="#7c2d12" stroke="none"/>
    <circle cx="776" cy="230" r="5" fill="#0f172a"/><circle cx="824" cy="230" r="5" fill="#0f172a" stroke="none"/>
    <path d="M780 262c12 10 28 10 40 0" fill="none"/>
