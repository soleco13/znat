    <path d="M738 318L688 392L742 300" fill="none" stroke="#0f172a" stroke-width="22" stroke-linejoin="round" stroke-linecap="round"/>
    <path d="M738 318L688 392L742 300" fill="none" stroke="#ffffff" stroke-width="14" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="748" cy="290" r="13" fill="#fde68a" stroke-width="3"/>
