    <rect x="120" y="30" width="60" height="60" rx="6" fill="#fef3c7"/>
    <rect x="200" y="20" width="50" height="70" rx="6" fill="#dbeafe"/>
    <rect x="270" y="38" width="70" height="52" rx="6" fill="#dcfce7"/>
    <rect x="720" y="28" width="60" height="62" rx="6" fill="#fee2e2"/>
    <rect x="800" y="40" width="70" height="50" rx="6" fill="#ede9fe"/>
  </g>
  <!-- стол -->
  <rect x="60" y="470" width="880" height="26" fill="#78716c"/>
  <rect x="100" y="496" width="22" height="160" fill="#57534e"/><rect x="878" y="496" width="22" height="160" fill="#57534e"/>
  <!-- штатив с пробирками -->
  <g stroke="#475569" stroke-width="3">
