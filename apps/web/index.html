<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Chrome предлагает перевод ru-страницы в браузере с другой локалью —
         в headless Chrome egress-записи (Э10.2 /egress) это всплывающее
         окно попадало прямо в кадр записи урока. -->
    <meta name="google" content="notranslate" />
    <title>Школа онлайн</title>
    <!-- Путь к шрифтам Excalidraw — отдельным файлом, а не inline-скриптом:
         CSP разрешает только скрипты с нашего домена (script-src 'self').
         Подробности — в самом public/excalidraw-asset-path.js. -->
    <script src="/excalidraw-asset-path.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
