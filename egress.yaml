# ─────────────────────────────────────────────────────────────────────────────
# Э10.1 — конфиг LiveKit Egress (вторая машина). Монтируется в контейнер
# read-only как /etc/egress.yaml (см. docker-compose.egress.yml).
#
# Формат и поля — по официальной документации LiveKit Egress
# (github.com/livekit/egress, config.go). Проверять через Context7 при
# обновлении образа: набор полей у egress меняется чаще, чем у самого сервера.
#
# Плейсхолдеры ${...} НЕ раскрываются самим egress (как и у livekit-server) —
# подставляются при разворачивании из .env.egress через `envsubst` в deploy,
# либо файл редактируется на месте. Секреты в git не коммитим.
# ─────────────────────────────────────────────────────────────────────────────

# Тот же api_key/secret, что у основного LiveKit — egress аутентифицируется
# в кластере как доверенный сервис.
api_key: ${LIVEKIT_API_KEY}
api_secret: ${LIVEKIT_API_SECRET}

# WebSocket-адрес основного LiveKit-сервера ПО ПРИВАТНОЙ СЕТИ провайдера.
# Никаких публичных доменов/IP. `ws://`, не `wss://` — трафик и так внутри
# приватной подсети, TLS там лишний оверхед на 720p-композит.
ws_url: ws://${MAIN_HOST_PRIVATE_IP}:7880

# Redis основной машины — та же инстанция, что держит BullMQ и LiveKit.
# Через неё egress получает задания (startEgress) и публикует статусы,
# которые основной сервер разошлёт вебхуками на /webhooks/livekit (Э10 —
# recordings/service.ts#applyEgressWebhook).
redis:
  address: ${MAIN_HOST_PRIVATE_IP}:6379

# Куда складывать готовые файлы. filepath = абсолютный путь внутри
# контейнера; каталог смонтирован из STORAGE_ROOT основной машины.
# API задаёт конкретное имя файла в запросе egress, здесь — только корень.
file_outputs:
  local: {}

# H.264 720p — целевой профиль записи (§10.10 ТЗ: «H.264 720p @1.5 Мбит/с»,
# чтобы хранилище не росло лавинообразно). Совпадает с пресетом
# H264_720P_30, который API передаёт в startRoomCompositeEgress.

# Метрики Prometheus — снимаются Grafana Agent'ом изнутри приватной сети
# (Э10.5: алерт «egress без публикующих», гейт Э10: CPU второй машины).
prometheus_port: 9090

# CPU-стоимость композита. `cpu_cost` подсказывает egress, сколько ядер
# резервировать под одну запись, чтобы не запускать вторую, когда машине
# уже тяжело. Для 2–6-ядерной машины: одна RoomComposite-запись за раз.
cpu_cost:
  room_composite_cpu_cost: 3.0

# Логи в stdout (docker собирает), JSON — чтобы Grafana Loki парсил поля.
logging:
  json: true
  level: info
