# Оверлей для боевого сервера (Э4.2, §10.3 ТЗ) — жёсткая раскладка ядер.
#
# Применяется ТОЛЬКО вместе с базовым файлом и только на проде:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (так и делает deploy.sh). Локально базовый docker-compose.yml используется
# без этого оверлея — иначе `docker compose up` падал бы на любой машине,
# где меньше 8 ядер.
#
# ─────────────────────────────────────────────────────────────────────────
# ГЛАВНЫЙ РИСК МОНОЛИТА (§10.3): конвертация PPTX — это всплеск на 100%
# нескольких ядер на 30–60 с. Если конвертер делит ядра с LiveKit — у всего
# класса заикается звук (медиа чувствительно к джиттеру планировщика).
# Решение — эксклюзивные ядра через cpuset. Это НЕ микрооптимизация (§17
# ТЗ, п.13; список «не урезать никогда» ПЛАН.md).
#
# Значения cpuset — под 8-ядерную машину. НА ДРУГОМ ЖЕЛЕЗЕ ПЕРЕСЧИТАТЬ:
#   ядра 0-3  → livekit + coturn   ЭКСКЛЮЗИВНО, ни с кем не делятся
#   ядра 4-5  → app (Node, event loop)
#   ядро  6   → postgres + redis
#   ядро  7   → converter (≤80% ядра) + caddy (≤20% ядра)
# ─────────────────────────────────────────────────────────────────────────

services:
  livekit:
    cpuset: "0-3"

  coturn:
    cpuset: "0-3"

  app:
    cpuset: "4-5"

  postgres:
    cpuset: "6"

  redis:
    cpuset: "6"

  converter:
    cpuset: "7"
    # period по умолчанию 100000 мкс → 80000 = не больше 0.8 ядра, даже
    # когда в очереди BullMQ несколько презентаций.
    cpu_quota: 80000

  caddy:
    cpuset: "7"
    cpu_quota: 20000

# Мониторинг (docker-compose.monitoring.yml) по §10.3 тоже живёт на ядре 7
# с квотой ~0.2. Его cpuset здесь не задан: тот файл запускается отдельной
# командой и используется в т.ч. локально (Grafana MCP на Э4), где жёсткий
# cpuset "7" сломал бы `up` на машине с <8 ядрами. На сервере пиннинг
# мониторинга — отдельным оверлеем, когда дойдут руки; контейнеры экспортёров
# и без того почти не едят CPU.
