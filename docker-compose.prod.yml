# Оверлей для боевого сервера (Э4.2, §10.3 ТЗ) — жёсткая раскладка ядер.
#
# Применяется ТОЛЬКО вместе с базовым файлом и только на проде:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (так и делает deploy.sh). Локально базовый docker-compose.yml используется
# без этого оверлея.
#
# ─────────────────────────────────────────────────────────────────────────
# ГЛАВНЫЙ РИСК МОНОЛИТА (§10.3): конвертация PPTX — это всплеск на 100%
# нескольких ядер на 30–60 с. Если конвертер делит ядра с LiveKit — у всего
# класса заикается звук (медиа чувствительно к джиттеру планировщика).
# Решение — эксклюзивные ядра через cpuset. Это НЕ микрооптимизация (§17
# ТЗ, п.13; список «не урезать никогда» ПЛАН.md).
#
# Значения cpuset ПЕРЕСЧИТАНЫ под РЕАЛЬНОЕ железо этого сервера — `nproc`
# показывает 2 ядра (не 8, как в исходном шаблоне для боевого сервера).
# На другом железе — пересчитать заново под фактическое число ядер:
#   ядро  0   → livekit + coturn   ЭКСКЛЮЗИВНО, ни с кем не делятся
#               (единственное, что реально защищает звук от джиттера —
#               остальное на этом железе просто некуда девать)
#   ядро  1   → всё остальное: app, postgres, redis, caddy, converter
#
# ВАЖНАЯ ОГОВОРКА для 2-ядерной машины (отличие от 8-ядерного шаблона):
# на 8 ядрах медиа-путь получал 4 ядра, а всему остальному оставалось 4.
# Здесь у медиа-пути — 1 ядро из 2, а ВСЕМУ остальному приложению
# (API, БД, конвертер, прокси) остаётся тоже только 1 ядро суммарно.
# Это защищает звук от заикания при конвертации (главный риск §10.3),
# но ценой того, что API/БД будут заметно проседать во время конвертации
# презентации — раньше (без cpuset, просто cpu_shares) они делили оба
# ядра с медиа и друг с другом. Компромисс осознанный и именно это
# нужно измерить реальным тестовым уроком (ConnectionQualityDot /
# PacketLossWarning в приложении), чтобы понять, того ли стоит.
# ─────────────────────────────────────────────────────────────────────────

services:
  livekit:
    cpuset: "0"

  coturn:
    cpuset: "0"

  app:
    cpuset: "1"

  postgres:
    cpuset: "1"

  redis:
    cpuset: "1"

  converter:
    cpuset: "1"
    # На 8-ядерном шаблоне у конвертера было своё эксклюзивное ядро с
    # квотой 0.8. Здесь оно делит ядро 1 с app/postgres/redis/caddy —
    # квота понижена до 0.5, чтобы всплеск конвертации не забирал себе
    # всё единственное оставшееся ядро целиком и не вешал API/БД на
    # время конвертации (в дополнение к тому, что и так уже недодано
    # звуку — см. оговорку выше).
    cpu_quota: 50000

  caddy:
    cpuset: "1"
    cpu_quota: 10000

# Мониторинг (docker-compose.monitoring.yml) по §10.3 тоже живёт на
# последнем ядре с небольшой квотой на 8-ядерном шаблоне. Здесь отдельно
# не пиннингуется — экспортёры почти не едят CPU, а свободного ядра под
# них на этой машине и так нет.
