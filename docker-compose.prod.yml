# Оверлей для боевого сервера (Э4.2, §10.3 ТЗ) — жёсткая раскладка ядер.
#
# Применяется ТОЛЬКО вместе с базовым файлом и только на проде:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# (так и делает deploy.sh). Локально базовый docker-compose.yml используется
# без этого оверлея.
#
# ─────────────────────────────────────────────────────────────────────────
# ГЛАВНЫЙ РИСК МОНОЛИТА (§10.3): конвертация PPTX — это всплеск на 100%
# нескольких ядер на 30–60 с. Если конвертер делит ядра с LiveKit — у всего
# класса заикается звук (медиа чувствительно к джиттеру планировщика).
# Решение — эксклюзивные ядра через cpuset. Это НЕ микрооптимизация (§17
# ТЗ, п.13; список «не урезать никогда» ПЛАН.md).
#
# Значения cpuset ПЕРЕСЧИТАНЫ под РЕАЛЬНОЕ железо (2026-10-11, сервер
# matis-edu.ru, 95.213.143.106): Intel i7-8700, 6 физических ядер, SMT —
# `nproc` = 12. Пары логических CPU одного физического ядра (`lscpu -e`,
# колонка CORE): (0,6) (1,7) (2,8) (3,9) (4,10) (5,11). Медиа получает ОБЕ
# половины своих физических ядер: SMT-сосед делит с ним конвейер и кэш, чужая
# нагрузка на соседе — тот же джиттер, что и на самом ядре.
#   CPU 0,6      → ни одного контейнера: ОС, dockerd, sshd и ВСЕ аппаратные
#                  прерывания (eth0 — одна очередь Realtek, через неё идёт
#                  весь медиа-трафик; irqbalance с IRQBALANCE_BANNED_CPULIST
#                  на хосте). Нагрузка приложения здесь увела бы softirq сети
#                  в ksoftirqd — задержка пакетов для всего класса.
#   CPU 1,2,7,8  → livekit + coturn   ЭКСКЛЮЗИВНО (2 физических ядра)
#   CPU 3,9      → app, postgres, redis, caddy (1 физическое ядро)
#   CPU 4,5,10,11→ converter (квота 0.8) и egress (запись, cpus 3 —
#                  docker-compose.egress.yml, cpu_cost 3 в .env.egress)
# На хосте (не в git): matis-cpu-tuning.service держит CPU 0,1,2,6,7,8 без
# глубоких C-состояний (пробуждение ≤ ~20 мкс вместо 150+), остальные спят
# глубоко. При смене раскладки — поправить и его (SHALLOW_CPUS).
#
# На другом железе — пересчитать заново под фактическое число ядер
# (шаблон для 2 ядер: livekit/coturn → "0", остальное → "1", converter
# квота 0.5, egress cpus 1.5 — компромисс, звук может страдать).
# ─────────────────────────────────────────────────────────────────────────

# Ротация docker-логов (json-file). Без неё логи livekit/coturn/caddy/БД
# росли до заполнения диска: каждый вход и выход участника, каждая
# TURN-аллокация — строка, а на том же диске Postgres и Redis (G-08 аудита
# гостевого доступа 2026-10-05). У app свой предел ниже (тот же размер).
x-logging: &rotated-logs
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  livekit:
    cpuset: "1,2,7,8"
    logging: *rotated-logs

  coturn:
    cpuset: "1,2,7,8"
    logging: *rotated-logs

  app:
    cpuset: "3,9"
    # Логи контейнера пропадают при каждом пересоздании (деплое), а разбирать
    # урок часто приходится на следующий день: дубль в файл на хосте
    # (plugins/logger.ts, LOG_FILE). Каталог /var/log/znat — владелец uid 999
    # (пользователь app в образе), ротация — /etc/logrotate.d/znat на хосте
    # (copytruncate). Пример конфига — deploy/logrotate-znat.
    environment:
      LOG_FILE: /var/log/znat/api.log
    volumes:
      - /var/log/znat:/var/log/znat
    # Свой json-лог Docker без ограничения рос бы до заполнения диска.
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  postgres:
    cpuset: "3,9"
    logging: *rotated-logs

  redis:
    cpuset: "3,9"
    logging: *rotated-logs

  converter:
    # Своё место, не с app/БД: всплеск LibreOffice (100% на 30–60 с) не
    # должен тормозить API. Делит CPU 4,5,10,11 только с egress (запись);
    # квота 0.8 CPU — как в 8-ядерном шаблоне, запись при конвертации
    # сохраняет минимум ~3 CPU.
    cpuset: "4,5,10,11"
    logging: *rotated-logs
    cpu_quota: 80000
    # ВЫКЛЮЧЕН по умолчанию (2026-10-11): образ не собирается — freshclam
    # получает 403 «Blocked by CDN» от database.clamav.net с IP сервера, а
    # без базы антивируса конвертер не собирается (так задумано, не обходить
    # молча). Профиль нужен, чтобы deploy.sh (build + up -d всех сервисов)
    # не падал на нём. Включить, когда база доступна (зеркало/прокси при
    # сборке): COMPOSE_PROFILES=converter в .env — compose читает его сам.
    profiles: ["converter"]

  caddy:
    cpuset: "3,9"
    logging: *rotated-logs
    # Через Caddy идёт весь TLS и раздача /files (слайды, картинки, MP4
    # записей) — при 0.1 CPU он становился узким местом при входе класса.
    # Не ниже 0.5 CPU; здесь в группе 2 логических CPU — даём 1.0.
    cpu_quota: 100000
    # Прод под доменом: Caddyfile.prod (Let's Encrypt на CADDY_DOMAIN,
    # www → апекс, сертификат TURN_DOMAIN для coturn) вместо Caddyfile для
    # работы по голому IP. Тот же путь в контейнере — compose заменяет
    # монтирование базового файла.
    volumes:
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
    environment:
      CADDY_DOMAIN: ${CADDY_DOMAIN:?set CADDY_DOMAIN in .env}
      TURN_DOMAIN: ${TURN_DOMAIN:?set TURN_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}

# Мониторинг (docker-compose.monitoring.yml) по §10.3 на 8-ядерном шаблоне
# жил на последнем ядре с небольшой квотой. Здесь отдельно не пиннингуется —
# экспортёры почти не едят CPU; если поднимать — на CPU 4,5,10,11 (не на
# медиа-ядра и не на 0,6 с прерываниями).
