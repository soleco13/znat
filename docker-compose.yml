services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://school:school@postgres:5432/school_dev
      REDIS_URL: redis://redis:6379
      STORAGE_ROOT: /data/assets
      # livekit слушает на network_mode: host — из моста (bridge) до него
      # достучаться можно только через шлюз хоста, не по имени сервиса.
      LIVEKIT_URL: ws://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - assets_data:/data/assets
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ВНИМАНИЕ (Э2.1, §10.5 ТЗ): network_mode: host требует Linux-хост с
  # реальным docker-демоном (прод — Ubuntu). На Docker Desktop (Windows/Mac)
  # host-сеть не поддерживается штатно — эти два сервиса локально на
  # Windows-машине разработчика не поднимутся, только на проде/Linux-CI.
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    network_mode: host
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Секреты и адрес не кладём в livekit.yaml: сам livekit-server не
      # раскрывает переменные окружения внутри YAML (проверено через Context7,
      # pkg/config/config.go — единственное исключение это путь key_file).
      # Поэтому весь конфиг собираем через LIVEKIT_CONFIG, а ключи — отдельно
      # через LIVEKIT_KEYS, это штатные переменные окружения самого сервера.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          use_external_ip: true
          stun_servers:
            - ${TURN_DOMAIN}:3478
          turn_servers:
            - host: ${TURN_DOMAIN}
              port: 3478
              protocol: udp
              secret: ${TURN_SHARED_SECRET}
        redis:
          address: 127.0.0.1:6379
        turn:
          enabled: false
        # Э2.7, §10.5 ТЗ: посещаемость и завершение урока по вебхукам, не
        # только по нашему собственному опросу. Порт 3000 доступен livekit'у
        # напрямую через 127.0.0.1 — сам livekit на network_mode: host (это
        # хост-неймспейс), а app публикует порт на 127.0.0.1 хоста (см. app
        # ниже), так что "через шлюз хоста" здесь не нужен, в отличие от
        # обратного направления app -> livekit чуть выше по файлу.
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:3000/webhooks/livekit

  # Свой TURN (§3.2, §10.5 ТЗ) вместо stun.l.google.com — часть учеников
  # сидит за школьными/корпоративными NAT, без TURN у них не будет медиа.
  # TLS (5349) сознательно не включаем в Э2.1: нужен реальный сертификат на
  # TURN_DOMAIN, это отдельная операционная задача при разворачивании на
  # боевом домене — см. "Известные пробелы" в docs/CURRENT_STAGE.md.
  coturn:
    image: coturn/coturn:latest
    restart: unless-stopped
    network_mode: host
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      - --min-port=49000
      - --max-port=49999
      - --realm=${TURN_DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # relay только наружу — TURN не должен превращаться в открытый шлюз
      # в приватные сети (SSRF через WebRTC-relay).
      - --denied-peer-ip=10.0.0.0-10.255.255.255
      - --denied-peer-ip=172.16.0.0-172.31.255.255
      - --denied-peer-ip=192.168.0.0-192.168.255.255

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

volumes:
  pg_data:
  redis_data:
  assets_data:
  caddy_data:
  caddy_config:
