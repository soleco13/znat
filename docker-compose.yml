services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    # Наблюдаемость и память: без pg_stat_statements и лога медленных запросов
    # проблему на реальном уроке не увидеть. shared_buffers — скромно: хост
    # делит память с LiveKit, egress и приложением.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - log_min_duration_statement=500ms
    shm_size: 256mb
    environment:
      POSTGRES_USER: school
      POSTGRES_PASSWORD: school
      POSTGRES_DB: school_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school -d school_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    # Пароль обязателен: Redis виден из сети converter'а, который разбирает
    # чужие pptx в LibreOffice. Без пароля взломанный конвертер мог бы
    # переписать присутствие, права и отзывы гостевых сессий. Converter
    # ходит отдельным пользователем — только ключи очереди BullMQ (bull:*),
    # без административных команд.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env}
      # Правило ACL — отдельными аргументами: одной строкой Redis считает
      # всю её именем пользователя и не стартует.
      - --user
      - converter
      - "on"
      - ">${CONVERTER_REDIS_PASSWORD:?set CONVERTER_REDIS_PASSWORD in .env}"
      - "~bull:*"
      - "&*"
      - "+@all"
      - "-@admin"
      - "-@dangerous"
      - "+info"
      - "+client|setname"
      - "+client|getname"
      - "+client|id"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    # convnet (internal: true) — общая шина только с изолированным converter'ом
    # (Э4.1). default — всё остальное (app, миграции). redis виден в обеих.
    networks:
      - default
      - convnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_VERSION: ${APP_VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://school:school@postgres:5432/school_dev
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      STORAGE_ROOT: /data/assets
      # /files/* отдаёт Caddy с того же тома (см. Caddyfile, X-Accel-Redirect).
      FILES_VIA_PROXY: "true"
      # Файлы прошлых сборок фронта: страница, открытая до выкладки, догружает
      # свои куски отсюда (apps/api/src/plugins/web-assets-archive.ts).
      WEB_ASSETS_ARCHIVE_DIR: /data/web-assets
      # livekit слушает на network_mode: host — из моста (bridge) до него
      # достучаться можно только через шлюз хоста, не по имени сервиса.
      LIVEKIT_URL: ws://host.docker.internal:7880
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - assets_data:/data/assets
      - web_assets:/data/web-assets
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ВНИМАНИЕ (Э2.1, §10.5 ТЗ): network_mode: host требует Linux-хост с
  # реальным docker-демоном (прод — Ubuntu). На Docker Desktop (Windows/Mac)
  # host-сеть не поддерживается штатно — эти два сервиса локально на
  # Windows-машине разработчика не поднимутся, только на проде/Linux-CI.
  livekit:
    # Версии медиа закреплены: `:latest` обновил бы медиа-сервер на любом pull.
    # Обновлять осознанно, с проверкой урока (CLAUDE.md: конфиги LiveKit — читать построчно).
    # Своя сборка: v1.13.8 (фикс dynacast #4907) + отчёты TWCC по времени
    # (services/livekit/Dockerfile). Откат: image livekit/livekit-server:v1.13.6
    # без build и `docker compose up -d livekit`.
    image: znat/livekit-server:v1.13.8-twcc
    build: services/livekit
    restart: unless-stopped
    network_mode: host
    # Медиа-путь в реальном времени — приоритет над CPU остальных контейнеров
    # (postgres/converter/egress на этой же машине), см. заметку у coturn ниже
    # про то же самое. cpu_shares — относительный вес, не жёсткая резервация:
    # не мешает остальным работать, когда livekit не занят.
    cpu_shares: 4096
    depends_on:
      redis:
        condition: service_healthy
    environment:
      # Секреты и адрес не кладём в livekit.yaml: сам livekit-server не
      # раскрывает переменные окружения внутри YAML (проверено через Context7,
      # pkg/config/config.go — единственное исключение это путь key_file).
      # Поэтому весь конфиг собираем через LIVEKIT_CONFIG, а ключи — отдельно
      # через LIVEKIT_KEYS, это штатные переменные окружения самого сервера.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}"
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          port_range_start: 50000
          port_range_end: 60000
          # use_external_ip: true (без node_ip) заставляет livekit
          # перебирать STUN-запросом КАЖДЫЙ интерфейс хоста — на этой
          # машине это, помимо публичного IP, ещё и docker-бриджи
          # (172.17/18/19.0.1), которые реальный клиент снаружи никогда
          # не достучится. Обнаружено в логах 2026-09-11: "using external
          # IPs" содержал вперемешку публичный IP и все три бридж-адреса —
          # это лишние (нерабочие) ICE-кандидаты, замедляющие/шумящие
          # согласование на каждом подключении. node_ip — штатное поле
          # livekit (yaml-тег `node_ip`, pkg rtcconfig) — задаёт единственный
          # адрес явно, без STUN-перебора по интерфейсам; use_external_ip
          # отключён, раз адрес и так известен точно (TURN_DOMAIN — тот же
          # публичный IP, что уже используется для TURN/STUN).
          use_external_ip: false
          node_ip: ${TURN_DOMAIN}
          # link-local IPv6 docker-интерфейсов (veth/bridge) pion пытается
          # занять по всему port_range: bind без зоны даёт EINVAL на каждый
          # из 10 000 портов, с перечитыванием интерфейсов на каждой попытке.
          # Нагрузочный тест 2026-09-26: каждый вход участника занимал ядро
          # LiveKit на 100% на десятки секунд. Внешнему клиенту эти адреса
          # всё равно недоступны.
          ips:
            excludes:
              - fe80::/10
          stun_servers:
            - ${TURN_DOMAIN}:3478
          turn_servers:
            - host: ${TURN_DOMAIN}
              port: 3478
              protocol: udp
              secret: ${TURN_SHARED_SECRET}
            # TURNS (TLS) на 5349 — для сетей со строгим файрволом/DPI, где
            # голый UDP на нестандартный порт режется целиком (частая причина
            # «у меня хороший интернет, а связь на уроке плохая» — см. заметку
            # деплоя). Сертификат самоподписанный (нет домена, только IP) —
            # в отличие от обычной HTTPS-страницы, ICE-агент браузера не
            # показывает предупреждение и не требует клика — TURNS кандидат
            # либо тихо срабатывает, либо тихо отбрасывается и ICE падает на
            # другой кандидат (UDP TURN/STUN). Проверить на реальном
            # проблемном подключении, это best-effort, не гарантия.
            - host: ${TURN_DOMAIN}
              port: ${TURN_TLS_PORT:-5349}
              protocol: tls
              secret: ${TURN_SHARED_SECRET}
        redis:
          address: 127.0.0.1:6379
          password: ${REDIS_PASSWORD}
        turn:
          enabled: false
        # Метрики SFU (PLI/NACK/потери/forward latency/оценка связи) для
        # Prometheus оверлея мониторинга. Порт наружу закрыт ufw — открыт
        # только docker-сетям (172.16.0.0/12), как 7880.
        prometheus:
          port: 6789
        # Э2.7, §10.5 ТЗ: посещаемость и завершение урока по вебхукам, не
        # только по нашему собственному опросу. Порт 3000 доступен livekit'у
        # напрямую через 127.0.0.1 — сам livekit на network_mode: host (это
        # хост-неймспейс), а app публикует порт на 127.0.0.1 хоста (см. app
        # ниже), так что "через шлюз хоста" здесь не нужен, в отличие от
        # обратного направления app -> livekit чуть выше по файлу.
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://127.0.0.1:3000/webhooks/livekit

  # Свой TURN (§3.2, §10.5 ТЗ) вместо stun.l.google.com — часть учеников
  # сидит за школьными/корпоративными NAT, без TURN у них не будет медиа.
  # TLS (5349) добавлен тестово (2026-09-11) с самоподписанным сертификатом
  # (./turn-certs, не в git, сгенерирован openssl на TURN_DOMAIN=IP) — на
  # боевом домене заменить на реальный сертификат (Let's Encrypt и т.п.), см.
  # "Известные пробелы" в docs/CURRENT_STAGE.md.
  coturn:
    # Версия закреплена по той же причине, что у livekit.
    image: coturn/coturn:4.18.0-r0
    restart: unless-stopped
    network_mode: host
    # Тот же приоритет, что у livekit — TURN relay на пути реального времени.
    cpu_shares: 4096
    volumes:
      - ./turn-certs/turn_cert.pem:/certs/turn_cert.pem:ro
      - ./turn-certs/turn_key.pem:/certs/turn_key.pem:ro
    command:
      - -n
      - --log-file=stdout
      - --listening-port=3478
      # TURN_TLS_PORT: 5349 по умолчанию. Для сетей, где открыт только 443,
      # TURNS ставится на 443 — но 443/tcp на этом IP занят Caddy: нужен
      # отдельный IP (--listening-ip/--relay-ip) или поддомен turn.* на нём,
      # и настоящий сертификат — браузер проверяет сертификат TURNS и с
      # самоподписанным молча отбрасывает кандидата.
      - --tls-listening-port=${TURN_TLS_PORT:-5349}
      - --cert=/certs/turn_cert.pem
      - --pkey=/certs/turn_key.pem
      - --min-port=49000
      - --max-port=49999
      - --realm=${TURN_DOMAIN}
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET}
      - --lt-cred-mech
      - --fingerprint
      - --no-cli
      - --no-multicast-peers
      # G-10 (аудит гостевого доступа 2026-10-05): relay — ТОЛЬКО к самому
      # LiveKit. TURN-учётку LiveKit выдаёт каждому вошедшему по ссылке на 4 ч
      # (ttl по умолчанию, 14400 с; короче нельзя — coturn проверяет срок на
      # каждом Refresh, длинный урок через TURN оборвался бы), а законный
      # адресат relay у браузера один — SFU на этом хосте (node_ip =
      # TURN_DOMAIN). Раньше запрещены были только частные IPv4: relay к
      # любому публичному адресу и в 100.64/10 работал (проверено
      # turnutils_uclient) — открытый ретранслятор за счёт канала сервера.
      # Сначала запрет всего IPv4 и IPv6 (заодно 0/8, 100.64/10, 127/8,
      # 169.254/16, ::1, fc00::/7, fe80::/10, ::ffff:0:0/96), потом
      # разрешение адреса LiveKit: allowed-peer-ip сильнее denied-peer-ip.
      # TURN_DOMAIN должен быть IP — его же берёт node_ip LiveKit.
      - --denied-peer-ip=0.0.0.0-255.255.255.255
      - --denied-peer-ip=::-ffff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
      - --allowed-peer-ip=${TURN_DOMAIN}
      # Браузер берёт у TURN только UDP-relay (RFC 6062 TCP-relay WebRTC не
      # использует), а TCP-relay — это туннель к произвольному TCP-сервису.
      - --no-tcp-relay
      # Аллокаций на одну учётку (= участник LiveKit). Нормально 2–4 (два
      # PeerConnection × UDP/TLS), после ICE-рестартов старые живут до 10 мин
      # — запас на частые обрывы связи. Без квоты одна учётка могла занять
      # все 1000 relay-портов (49000–49999).
      - --user-quota=30
      # Потолок скорости на сессию (байт/с, каждое направление отдельно):
      # 30 Мбит/с — в несколько раз выше самого тяжёлого честного потока
      # (сетка 30 камер + демонстрация у учителя ~10–15 Мбит/с). Урок не
      # задевает, бесконечный поток через одну аллокацию — режет.
      - --max-bps=3750000

  # Конвертер презентаций (Э4.1, §10.2/§10.3/§17 ТЗ). ИЗОЛИРОВАН:
  # - convnet (internal: true) — видит только redis, маршрута в интернет нет
  #   (парсинг недоверенных офисных файлов — вектор RCE);
  # - read_only rootfs, cap_drop ALL, no-new-privileges — минимум привилегий;
  # - /tmp как tmpfs — единственная writable точка (профиль LibreOffice туда же
  #   через HOME=/tmp, задаётся в Dockerfile).
  # cpuset/cpu_quota (жёсткая раскладка ядер, чтобы конвертация не заикала
  # звук) добавляются в Э4.2. Пайплайн BullMQ — Э4.3.
  converter:
    build:
      context: .
      dockerfile: services/converter/Dockerfile
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://converter:${CONVERTER_REDIS_PASSWORD}@redis:6379
      STORAGE_ROOT: /data/assets
    networks:
      - convnet
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - "no-new-privileges:true"
    tmpfs:
      - "/tmp:size=2g"
    mem_limit: 3g
    volumes:
      - assets_data:/data/assets

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./landing/dist:/srv/landing:ro
      # Хранилище файлов — только чтение: Caddy отдаёт /files/* после проверки подписи в app.
      - assets_data:/srv/files:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "80:80"
      - "443:443"

networks:
  default:
  # internal: true — у сети нет маршрута наружу (§10.3 ТЗ). В ней сидят только
  # converter и redis. Ключевой барьер изоляции конвертера.
  convnet:
    internal: true

volumes:
  pg_data:
  redis_data:
  assets_data:
  web_assets:
  caddy_data:
  caddy_config:
